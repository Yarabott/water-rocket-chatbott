<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Water Rocket Launcher Assistant</title>
<style>
:root{--bg:#f5f7fa;--surface:#fff;--text:#1a2433;--muted:#667085;--accent:#1e6fe0;--accent-text:#fff;--bubble:#e9eef6;--border:#d9e0ea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1622;--surface:#172033;--text:#e8edf5;--muted:#93a1b8;--accent:#4a90ff;--accent-text:#0b1220;--bubble:#1f2b42;--border:#2a3956;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1622;--surface:#172033;--text:#e8edf5;--muted:#93a1b8;--accent:#4a90ff;--accent-text:#0b1220;--bubble:#1f2b42;--border:#2a3956;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;max-width:760px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--surface)}
header h1{font-size:17px;margin:0;flex:1}
button{font:inherit;cursor:pointer}
.ghost{background:none;border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 10px}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word}
.user{align-self:flex-end;background:var(--accent);color:var(--accent-text);border-bottom-right-radius:4px}
.bot{align-self:flex-start;background:var(--bubble);border-bottom-left-radius:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:999px;padding:6px 12px;font-size:14px}
form,.bar{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--border);background:var(--surface)}
#q{flex:1;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text)}
#send{background:var(--accent);color:var(--accent-text);border:0;border-radius:10px;padding:0 18px}
#send:disabled{opacity:.5}
#notes{display:none;flex-direction:column;gap:8px;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--surface)}
#notes.open{display:flex}
#notes textarea{height:200px;font:14px/1.4 ui-monospace,Menlo,Consolas,monospace;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);resize:vertical}
#notes small{color:var(--muted)}
</style>
</head>
<body>
<header>
  <span style="font-size:22px">🚀</span>
  <h1>Water Rocket Launcher Assistant</h1>
  <button class="ghost" id="toggle">Project notes</button>
  <button class="ghost" id="clear">Clear</button>
</header>
<div id="notes">
  <small>The chatbot answers from these notes. Replace the example details with your own launcher's specs, materials, test results and so on. Saved in this browser.</small>
  <textarea id="kb" spellcheck="false"></textarea>
  <div style="display:flex;gap:8px"><button class="ghost" id="save">Save notes</button><button class="ghost" id="reset">Reset to example</button></div>
</div>
<div id="chat"></div>
<form id="f">
  <input id="q" placeholder="Ask anything about your water rocket launcher…" autocomplete="off">
  <button id="send" type="submit">Send</button>
</form>

<script>
const DEFAULT_KB = `PROJECT: Water bottle rocket launcher (EXAMPLE NOTES - replace with your own details)

GOAL
- Launch a 2 L PET soda-bottle rocket using water and compressed air, as high/far as possible, safely and repeatably.

LAUNCHER DESIGN (example)
- Base: wooden board with a stake/ground anchors so it doesn't tip.
- Nozzle/seal: rubber stopper or Gardena-style quick-release connector holding the bottle neck.
- Release: pull-string trigger so the operator stands several metres away.
- Air supply: bicycle pump or small compressor with a pressure gauge and a check valve.
- Launch tube/guide rod for the first moments of flight (improves straight-line launch).

ROCKET (example)
- 2 L PET bottle, 3-4 fins (cardboard/plastic), nose cone, ~1/3 water fill (about 600-700 ml).
- Typical working pressure: 60-100 psi (4-7 bar). Never exceed the bottle's tested limit; PET soda bottles are usually safe up to ~100-120 psi, burst higher.

HOW IT WORKS
- Compressed air pushes water out of the nozzle; by Newton's third law the water goes down, the rocket goes up.
- Thrust depends on pressure and nozzle diameter. Smaller nozzle = longer thrust, larger = stronger short thrust.
- Best water fill is usually 25-40% of bottle volume.

SAFETY RULES
- Wear eye protection; keep everyone well back (10 m+) and never stand over the rocket.
- Use water only for pressurizing tests; use a gauge; stop if the bottle is scratched, cracked or deformed.
- Launch outdoors in an open area, no wind gusts, never aim at people, buildings or animals.
- Use a pull-string so nobody is near during pressurization and launch.

TROUBLESHOOTING
- Leaks at the seal: check stopper/O-ring, bottle neck rim, tighten clamp.
- Rocket veers off: fins misaligned or uneven, add weight to nose, use guide rod.
- Low height: too much/too little water, nozzle too small, low pressure, too much drag/weight.
- Launcher releases early: trigger mechanism too loose; adjust retaining clip.

RESULTS / TEST LOG
- (add your launch results here: pressure, water volume, height/distance)

MATERIALS & BUDGET
- (add your materials, costs, build steps, photos description, school/competition requirements)
`;

const SYSTEM = `You are the dedicated assistant for ONE project: the user's water rocket launcher.
Answer anything related to the project: design, building, materials, physics, safety, testing, troubleshooting, improvements, presentations and reports.
Rules:
- Treat the PROJECT NOTES below as the source of truth about THIS project. When they cover the question, answer from them.
- When the notes do not cover it, answer with sound general water-rocket knowledge, and say clearly it is general advice rather than from their notes.
- Never invent specific facts about their build (measurements, results, parts). If unknown, say so and suggest what to add to the notes.
- Always put safety first (eye protection, distance, pressure limits, tested bottles).
- Be friendly, clear and concise. Use short paragraphs or simple lists. If asked something unrelated to the project, politely steer back.
- For physics, show simple formulas and worked numbers when helpful.`;

const $ = id => document.getElementById(id);
const chat = $('chat');
let history = [], busy = false, sample = null;

function store(k, v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){return null;} }
$('kb').value = store('kb') || DEFAULT_KB;

function add(role, text){
  const d = document.createElement('div');
  d.className = 'msg ' + (role==='user'?'user':'bot');
  d.textContent = text;
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
  return d;
}
function welcome(){
  chat.innerHTML=''; history=[];
  add('bot','Hi! I\u2019m your water rocket launcher assistant. Ask me anything about the design, physics, safety, building or troubleshooting. Tap \u201CProject notes\u201D to add your own launcher\u2019s details so my answers match your project.');
  const c = document.createElement('div'); c.className='chips';
  ['How does the launcher work?','What pressure is safe?','Why does my rocket veer off?','How much water should I use?','Help me write a project report intro'].forEach(t=>{
    const b=document.createElement('button'); b.textContent=t; b.onclick=()=>ask(t); c.appendChild(b);
  });
  chat.appendChild(c);
}
async function ask(text){
  text=text.trim(); if(!text||busy) return;
  const chips=chat.querySelector('.chips'); if(chips) chips.remove();
  add('user',text); history.push({role:'user',content:text});
  const out = add('bot','Thinking\u2026');
  busy=true; $('send').disabled=true;
  try{
    if(!sample) sample = await claude.use('sample');
    if(!sample){ out.textContent='The AI assistant is not available in this view. Open the page from your claude.ai artifact link.'; return; }
    const msgs = history.map(m=>({role:m.role,content:m.content}));
    msgs[0] = {role:'user', content: SYSTEM + '\n\n=== PROJECT NOTES ===\n' + $('kb').value + '\n=== END NOTES ===\n\nConversation follows. Reply to the last user message.\n\nUser: ' + msgs[0].content};
    const r = await sample(msgs,{cache:false,onText:({text})=>{out.textContent=text;chat.scrollTop=chat.scrollHeight;}});
    out.textContent = r.text; history.push({role:'assistant',content:r.text});
  }catch(e){
    out.textContent = e && e.code==='not_granted' ? 'Permission to use the AI was declined. Reload and allow it to chat.' : e && e.code==='rate_limited' ? 'Too many requests, please wait a moment and try again.' : 'Sorry, something went wrong. Please try again.';
    history.pop();
  }finally{ busy=false; $('send').disabled=false; chat.scrollTop=chat.scrollHeight; }
}
$('f').addEventListener('submit',e=>{e.preventDefault();const v=$('q').value;$('q').value='';ask(v);});
$('toggle').onclick=()=>$('notes').classList.toggle('open');
$('save').onclick=()=>{store('kb',$('kb').value);$('notes').classList.remove('open');};
$('reset').onclick=()=>{$('kb').value=DEFAULT_KB;store('kb',DEFAULT_KB);};
$('clear').onclick=welcome;
welcome();
</script>
</body>
</html>
